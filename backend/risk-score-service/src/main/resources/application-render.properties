server.port=${PORT:10000}
clients.transaction-service=${TRANSACTION_SERVICE_URL}
clients.ml-service=${ML_SERVICE_URL}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

spring.cloud.openfeign.client.config.default.connectTimeout=10000
spring.cloud.openfeign.client.config.default.readTimeout=180000
management.endpoint.health.show-details=never
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET
